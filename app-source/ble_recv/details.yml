short_description: Receive files over BLE from phone or another Cardputer

description: |
  Receives text/files over Bluetooth Low Energy using the Nordic UART Service.
  Works with the companion Android app **Cardputer BLE Blocks** and with
  `ble_send` running on another Cardputer.

  Protocol uses block markers (`##BLOCKS`, `##TYPE`, `##FILE`, `##ID`, `##MORE`).
  All protocol lines are stripped before saving. The file is only written when
  the final block arrives (no `##MORE`).

  - Advertises as `Cardputer-ADV`
  - Saves to `/apps` or `/sd/apps`
  - Optional filename edit on completion
  - Quit with ESC, ` or G0

installation_instructions: |
  Copy the entire `ble_recv` folder into your `/apps` directory
  (so you have `/apps/ble_recv/__init__.py` and `/apps/ble_recv/icon.raw`).

  Companion Android app and `ble_send` are available in the same project.

devices:
- Cardputer_Adv
